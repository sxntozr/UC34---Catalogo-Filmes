<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Cadastre, consulte, edite e exclua filmes no seu catálogo.">
    <title>{% block title %}Catálogo de Filmes{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='style.css') }}">
</head>
<body>
    <header class="topo">
        <div class="container topo-conteudo">
            <a class="marca" href="{{ url_for('index') }}">🎬 Catálogo de Filmes</a>
            <nav>
                <a href="{{ url_for('index') }}">Início</a>
                <a class="nav-botao" href="{{ url_for('novo_filme') }}">+ Novo filme</a>
            </nav>
        </div>
    </header>

    <main class="container principal">
        {% with mensagens = get_flashed_messages(with_categories=true) %}
            {% if mensagens %}
                <div class="mensagens">
                    {% for categoria, mensagem in mensagens %}
                        <div class="alerta {{ categoria }}">{{ mensagem }}</div>
                    {% endfor %}
                </div>
            {% endif %}
        {% endwith %}

        {% block content %}{% endblock %}
    </main>

    <footer class="rodape">
        <div class="container">Catálogo de Filmes · Projeto prático UC32</div>
    </footer>
</body>
</html>
