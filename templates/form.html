{% extends "base.html" %}

{% block title %}{{ acao }} | Catálogo de Filmes{% endblock %}

{% block content %}
<section class="form-pagina">
    <a class="voltar" href="{{ url_for('index') }}">← Voltar ao catálogo</a>
    <div class="form-cartao">
        <p class="sobretitulo">CATÁLOGO DE FILMES</p>
        <h1>{{ acao }}{% if acao == 'Cadastrar' %} filme{% endif %}</h1>
        <p class="descricao">Preencha os dados abaixo.</p>

        <form method="post" class="formulario">
            <div class="campo">
                <label for="titulo">Título do filme</label>
                <input id="titulo" name="titulo" type="text" maxlength="150"
                       placeholder="Ex.: Interestelar"
                       value="{{ filme['titulo'] if filme else '' }}" required>
            </div>

            <div class="campo">
                <label for="genero">Gênero</label>
                <input id="genero" name="genero" type="text" maxlength="80"
                       placeholder="Ex.: Ficção científica"
                       value="{{ filme['genero'] if filme else '' }}" required>
            </div>

            <div class="campos-duplos">
                <div class="campo">
                    <label for="ano">Ano de lançamento</label>
                    <input id="ano" name="ano" type="number" min="1888" max="2100"
                           placeholder="Ex.: 2014"
                           value="{{ filme['ano'] if filme else '' }}" required>
                </div>
                <div class="campo">
                    <label for="nota">Nota (1 a 10)</label>
                    <input id="nota" name="nota" type="number" min="1" max="10" step="0.1"
                           placeholder="Ex.: 9.5"
                           value="{{ filme['nota'] if filme else '' }}" required>
                </div>
            </div>

            <div class="botoes-form">
                <a class="botao secundario" href="{{ url_for('index') }}">Cancelar</a>
                <button class="botao primario" type="submit">{{ acao }}</button>
            </div>
        </form>
    </div>
</section>
{% endblock %}
